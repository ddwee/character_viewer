[package]
name = "cv-app"
description = "character_viewer（タスクトレイ常駐のアプリ。設定画面とエンジン）"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
cv-engine = { path = "../engine" }
log = "0.4.35"
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = "2"
