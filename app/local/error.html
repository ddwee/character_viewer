<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>character_viewer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #fff;
        --text: #1d2330;
        --muted: #5b6475;
        --accent: #3b6fd8;
        --danger: #c0392b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15181e;
          --card: #1f242d;
          --text: #e7eaf0;
          --muted: #9aa3b2;
          --accent: #6f9bff;
          --danger: #ff6b5e;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.7 'BIZ UDPGothic', 'Yu Gothic UI', 'Segoe UI', sans-serif;
      }
      main {
        max-width: 720px;
        margin: 48px auto;
        padding: 0 24px;
      }
      .card {
        background: var(--card);
        border-radius: 14px;
        padding: 28px 32px;
        box-shadow: 0 2px 12px rgb(0 0 0 / 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        color: var(--danger);
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
        background: rgb(127 127 127 / 0.12);
        padding: 12px 14px;
        border-radius: 8px;
        font: 13px/1.6 Consolas, 'BIZ UDGothic', monospace;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }
      button {
        font: inherit;
        padding: 9px 18px;
        border-radius: 8px;
        border: 1px solid rgb(127 127 127 / 0.35);
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      p.muted {
        color: var(--muted);
        font-size: 14px;
      }
      #msg {
        min-height: 1.5em;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>起動できませんでした</h1>
        <pre id="error">原因を確認しています…</pre>
        <p class="muted">
          よくある原因: すでに character_viewer が起動している / 更新の途中で止まった / 部品の版の組み合わせが合わない。<br />
          「PowerShell を開く」で詳しい状況（エラーメッセージ・ログ・部品の版）を確認できます。
        </p>
        <div class="buttons">
          <button class="primary" onclick="call('restart')">もう一度起動する</button>
          <button onclick="call('rebuild')">作り直す</button>
          <button onclick="call('open_terminal')">PowerShell を開く</button>
          <button onclick="call('open_logs')">ログのフォルダを開く</button>
        </div>
        <p id="msg"></p>
      </div>
    </main>
    <script>
      document.getElementById('error').textContent = window.__CV_ERROR || '原因が分かりませんでした。ログを確認してください。';
      async function call(cmd) {
        const msg = document.getElementById('msg');
        try {
          await window.__TAURI__.core.invoke(cmd);
          msg.textContent = cmd === 'rebuild' ? '作り直しを別のウィンドウで始めました。終わると自動で起動し直します。' : '';
        } catch (e) {
          msg.textContent = String(e);
        }
      }
    </script>
  </body>
</html>
