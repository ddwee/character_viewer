<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>character_viewer カメラ</title>
    <link rel="icon" href="../favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14161a;
        color: #e8eaee;
        font: 14px/1.6 'Yu Gothic UI', 'BIZ UDGothic', system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        background: #000;
      }
      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      /* 鏡のように見せる（自分の動きと同じ向きに映る） */
      .mirror video,
      .mirror canvas {
        transform: scaleX(-1);
      }
      .info {
        padding: 8px 12px;
      }
      #status {
        font-weight: 600;
      }
      #status.bad {
        color: #ff8a80;
      }
      #status.ok {
        color: #8fd694;
      }
      #detail {
        margin: 2px 0 0;
        color: #9aa3b2;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="marks"></canvas>
    </div>
    <div class="info">
      <div id="status">準備しています…</div>
      <p id="detail">このウィンドウは閉じても、顔の読み取りは続きます。カメラを止めるには、設定画面の「カメラ」で「カメラを使う」を切ります。</p>
    </div>
    <script type="module" src="../src/tracker/main.ts"></script>
  </body>
</html>
