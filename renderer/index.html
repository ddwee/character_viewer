<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>character_viewer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body.checker {
        background: repeating-conic-gradient(#bbb 0 25%, #eee 0 50%) 0 0 / 32px 32px;
      }
      canvas {
        display: block;
      }
      .panel {
        position: fixed;
        left: 8px;
        margin: 0;
        padding: 6px 10px;
        border-radius: 6px;
        font: 14px/1.5 'BIZ UDGothic', 'Yu Gothic UI', monospace;
        white-space: pre;
        pointer-events: none;
      }
      #overlay {
        top: 8px;
        color: #fff;
        background: rgb(0 0 0 / 0.6);
      }
      #error {
        bottom: 8px;
        color: #fff;
        background: rgb(180 30 30 / 0.85);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <pre id="overlay" class="panel" hidden></pre>
    <pre id="error" class="panel" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
